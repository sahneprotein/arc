[package]
name = "editor-ui"
description = "The arc editor's native UI: theme from the design tokens, widgets and panels"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bevy = { workspace = true, features = ["3d", "ui", "bevy_feathers"] }
editor-core = { workspace = true }
editor-services = { workspace = true }
scene-data = { workspace = true }
# The desktop's own folder chooser, for the project browser: the editor does not draw a
# file browser of its own. It is named here, and not in the application, so that this
# crate's own build and the application's use the engine with the same features.
rfd = "0.15"

[build-dependencies]
serde_json = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }
