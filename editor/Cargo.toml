[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
scene-data = { path = "crates/scene-data" }
project-spec = { path = "crates/project-spec" }
editor-core = { path = "crates/editor-core" }
editor-cook = { path = "crates/editor-cook" }
editor-services = { path = "crates/editor-services" }
particle-spec = { path = "crates/particle-spec" }
particle-runtime = { path = "crates/particle-runtime", default-features = false }
landscape-render = { path = "crates/landscape-render" }
serde = { version = "=1.0.229", features = ["derive", "rc"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
glam = "=0.32.1"
tempfile = "=3.20.0"
bevy = { path = "..", version = "=0.19.1", default-features = false }
bevy_egui = { version = "=0.40.1", default-features = false, features = ["render", "bevy_ui", "default_fonts", "picking"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Local development uses exactly this worktree's 0.19.1 engine. Release pinning
# is required before arc-game distribution; main is untouched.
[patch.crates-io]
bevy = { path = ".." }
bevy-settings = { path = "../crates/bevy_settings" }
