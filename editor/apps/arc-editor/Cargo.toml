[package]
name = "arc-editor"
description = "The arc level editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bevy = { workspace = true, features = ["3d", "ui", "bevy_feathers"] }
editor-ui = { path = "../../crates/editor-ui" }
editor-core = { workspace = true }
scene-data = { workspace = true }
landscape-render = { workspace = true, features = ["bevy-render"] }
# The game's particle runtime, for the Particles tool's GPU preview. The effect is built
# by the adapter the game shares; Hanabi is named here for the types an effect is spawned
# and asked about with, at the version the adapter is built on.
particle-runtime = { workspace = true, features = ["hanabi-3d"] }
bevy_hanabi = { version = "=0.19.0", default-features = false, features = ["3d"] }
