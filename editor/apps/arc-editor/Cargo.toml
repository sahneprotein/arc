[package]
name = "arc-editor"
description = "The arc level editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bevy = { workspace = true, features = ["3d", "ui", "bevy_feathers"] }
editor-ui = { path = "../../crates/editor-ui" }
editor-core = { workspace = true }
scene-data = { workspace = true }
landscape-render = { workspace = true, features = ["bevy-render"] }
